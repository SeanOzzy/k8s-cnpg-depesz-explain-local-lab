apiVersion: apps/v1
kind: Deployment
metadata:
  name: explain-app
  namespace: explain
  labels:
    app.kubernetes.io/name: explain-app
    app.kubernetes.io/part-of: pg-explain-k8s
spec:
  # Overlays patch this value per environment (1 for dev, 2 for prod)
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: explain-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: explain-app
        app.kubernetes.io/part-of: pg-explain-k8s
    spec:
      # Init container 
      # Waits for the CNPG primary to accept connections before starting the app.
      # This prevents the app from crash-looping while Postgres is bootstrapping.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to accept connections..."
              until pg_isready -h pg-explain-rw -p 5432 -U explain_app -d explain; do
                echo "  PostgreSQL not ready — retrying in 5s"
                sleep 5
              done
              echo "PostgreSQL is ready."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-explain-app-secret
                  key: password

      containers:
        - name: explain-app
          # This image is built from app/docker/Dockerfile.
          # Override in your overlay or use a pre-built image from a registry.
          image: pg-explain-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http

          # Environment
          # CNPG generates a Secret named 'pg-explain-app' (format:
          # {cluster}-{role}) containing host, port, dbname, user, password.
          # We reconstruct DATABASE_URL from its parts so the app has one
          # well-known variable to consume.
          env:
            - name: PG_HOST
              value: "pg-explain-rw"
            - name: PG_PORT
              value: "5432"
            - name: PG_DATABASE
              value: "explain"
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: pg-explain-app-secret
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-explain-app-secret
                  key: password
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: pg-explain-app-secret
                  key: app_secret
            - name: MOJO_MODE
              value: "production"

          # Probes
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6

          # Resources
          # Conservative defaults for a laptop kind cluster.
          # Overlays can patch these up/down as needed.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
