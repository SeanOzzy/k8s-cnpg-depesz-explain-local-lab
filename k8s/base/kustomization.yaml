apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pull in all base components.
# Overlays reference this root kustomization via ../../base.
resources:
  - namespace/
  - postgres/
  - app/

# Common labels applied to every resource in the base.
# Overlays can add more labels via the labels field.
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
