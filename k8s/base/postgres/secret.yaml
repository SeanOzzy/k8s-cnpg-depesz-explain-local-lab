# Application user credentials.
# CNPG bootstrap.initdb.secret references this to create the 'explain_app' role.
apiVersion: v1
kind: Secret
metadata:
  name: pg-explain-app-secret
  namespace: explain
  labels:
    app.kubernetes.io/part-of: pg-explain-k8s
type: kubernetes.io/basic-auth
data:
  username: ZXhwbGFpbl9hcHA=      # explain_app
  password: ZXhwbGFpbl9kZXZfcGFzc3dvcmQ=   # explain_dev_password
  app_secret: Wlhod2JHRnBibDlrWlhaZmNHRnpjM2R2Y21RPQ==

---

# Superuser credentials.
# Referenced by spec.superuserSecret in cluster.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: pg-explain-superuser-secret
  namespace: explain
  labels:
    app.kubernetes.io/part-of: pg-explain-k8s
type: kubernetes.io/basic-auth
data:
  # username: postgres
  username: cG9zdGdyZXM=
  # password: postgres_dev_superuser  ← CHANGE THIS before any public deployment
  password: cG9zdGdyZXNfZGV2X3N1cGVydXNlcg==
