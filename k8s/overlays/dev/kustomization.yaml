apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── Dev overlay ────────────────────────────────────────────────────────────
# Intended for local kind cluster development.
# Changes from base:
#   - App: 1 replica, relaxed resource limits
#   - Service: NodePort 30080 → maps to host port 8080 via kind-config.yaml
#   - Postgres: 2 instances (primary + 1 replica — same as base, kept explicit)
#   - Image: uses locally built image (imagePullPolicy: IfNotPresent)
# ───────────

resources:
  - ../../base

namespace: explain

labels:
  - pairs:
      environment: dev
    includeSelectors: false

patches:
  # Service: switch to NodePort 
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: explain-app
        namespace: explain
      spec:
        type: NodePort
        ports:
          - name: http
            port: 80
            targetPort: http
            nodePort: 30080

  # Deployment: 1 app pod, no resource limits (laptop-friendly) 
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: explain-app
        namespace: explain
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: explain-app
                env:
                  - name: APP_ENV
                    value: "development"
                resources:
                  requests:
                    cpu: "50m"
                    memory: "64Mi"
                  limits:
                    cpu: "500m"
                    memory: "256Mi"
